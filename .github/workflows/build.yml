name: Build Hybrid-Mount Lite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build lite
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: 'tree:0'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src, clippy, rustfmt

      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          cargo ndk --version
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Build lite
        env:
          HYBRID_MOUNT_NOTIFY: '0'
        run: |
          set -euo pipefail
          rm -rf output
          cargo xtask build --ci --flavor lite

          ZIP_PATH="$(find output -maxdepth 1 -type f -name 'Hybrid-Mount-Lite-*.zip' | sort | head -n 1)"
          test -n "$ZIP_PATH"
          echo "ARTIFACT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$(basename "${ZIP_PATH%.zip}")" >> "$GITHUB_ENV"
          sha256sum "$ZIP_PATH"

      - name: Upload Lite artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}
          compression-level: 0
          if-no-files-found: error
